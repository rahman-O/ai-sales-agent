# PRE-P14 local Docker demo stack — zero-cost, no Meta, no hosted DB.
# Host seed/reset still targets 127.0.0.1:5433 (do not weaken assert-local-demo-db).
#
# Usage:
#   npm run demo:up
#   npm run demo:reseed
#   npm run demo:verify
#   open http://localhost:3000
#
# TEI (knowledge embeddings): include profile
#   docker compose -f docker-compose.demo.yml --profile knowledge up -d

name: ai-sales-demo

services:
  provider-simulator:
    profiles: ["provider-simulator"]
    build:
      context: .
      dockerfile: Dockerfile.provider-simulator
    container_name: ai-sales-demo-provider-simulator
    environment:
      APP_ENV: simulator
      META_SIMULATOR_PORT: "3415"
      SIMULATOR_CONTAINER_MODE: "true"
      META_WHATSAPP_APP_SECRET: ${META_WHATSAPP_APP_SECRET:-mb15a-simulator-secret}
    ports:
      - "127.0.0.1:3415:3415"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3415/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - demo
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-sales-demo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_sales_agent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.demo.local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ai_sales_demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_sales_agent}"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - demo

  redis:
    image: redis:7.4-alpine
    container_name: ai-sales-demo-redis
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - demo

  tei:
    profiles: ["knowledge"]
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    container_name: ai-sales-demo-tei
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ai_sales_demo_hf_cache:/data
    command:
      - "--model-id"
      - "Qwen/Qwen3-Embedding-0.6B"
      - "--revision"
      - "97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3"
      - "--dtype"
      - "float32"
      - "--max-batch-tokens"
      - "2048"
      - "--max-concurrent-requests"
      - "4"
    environment:
      HF_HUB_ENABLE_HF_TRANSFER: "0"
    mem_limit: 12g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:80/health >/dev/null 2>&1 || wget -qO- http://127.0.0.1:80/info >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - demo

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: ai-sales-demo-migrate
    environment:
      NODE_ENV: development
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_sales_agent}
      APP_RUNTIME_DB_PASSWORD: ${APP_RUNTIME_DB_PASSWORD:?set APP_RUNTIME_DB_PASSWORD in .env.demo.local}
      ALLOW_RUNTIME_ROLE_PROVISION: "true"
      # provision script must not rewrite host .env.local inside container
      WRITE_DATABASE_URL_FROM_MIGRATION_HOST: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - demo
    restart: "no"

  ollama:
    profiles: ["local-ai"]
    image: ollama/ollama:latest
    container_name: ai-sales-demo-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - demo
    restart: unless-stopped

  ollama-bootstrap:
    profiles: ["local-ai"]
    image: ollama/ollama:latest
    container_name: ai-sales-demo-ollama-bootstrap
    environment:
      OLLAMA_HOST: http://ollama:11434
      AI_MODEL_NAME: ${AI_MODEL_NAME:-qwen2.5:1.5b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Checking if model $${AI_MODEL_NAME} exists in Ollama..."
        if ollama list | grep -q "$${AI_MODEL_NAME}"; then
          echo "MODEL_ALREADY_PRESENT: $${AI_MODEL_NAME}"
        else
          echo "Pulling model $${AI_MODEL_NAME}..."
          ollama pull "$${AI_MODEL_NAME}"
          echo "MODEL_PULL_COMPLETE: $${AI_MODEL_NAME}"
        fi
        exit 0
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - demo
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ai-sales-demo-api
    environment:
      # Override image default production so local demo runtime works
      NODE_ENV: development
      DEMO_DB_TARGET: LOCAL
      DEMO_FORCE_LOCAL_DB: "1"
      AI_PROVIDER: ${AI_PROVIDER}
      AI_MODEL_BASE_URL: http://ollama:11434/v1
      AI_MODEL_API_KEY: local
      AI_MODEL_NAME: ${AI_MODEL_NAME:-qwen2.5:1.5b}
      AI_MODEL_LOCAL_TIMEOUTS: "1"
      AI_MODEL_TIMEOUT_MS: ${AI_MODEL_TIMEOUT_MS:-360000}
      AI_RUN_DEADLINE_MS: ${AI_RUN_DEADLINE_MS:-900000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL}
      DEEPSEEK_TIMEOUT_MS: ${DEEPSEEK_TIMEOUT_MS}
      DEEPSEEK_RUN_DEADLINE_MS: ${DEEPSEEK_RUN_DEADLINE_MS:-300000}
      WORKER_LEASE_TTL_SECONDS: ${WORKER_LEASE_TTL_SECONDS:-300}
      DEMO_DOCKER_LOCAL_LLM: "1"
      APP_URL: http://localhost:3000
      API_URL: http://localhost:3001
      DATABASE_URL: postgresql://app_runtime:${APP_RUNTIME_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_sales_agent}
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_sales_agent}
      REDIS_URL: redis://redis:6379
      EMBEDDING_LOCAL_BASE_URL: http://tei:80
      BOOKING_SLOT_TOKEN_SECRET: ${BOOKING_SLOT_TOKEN_SECRET:?set BOOKING_SLOT_TOKEN_SECRET in .env.demo.local}
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env.demo.local}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      PORT: "3001"
      API_BIND_HOST: "0.0.0.0"
      PROVIDER_MODE: meta-simulator
      META_GRAPH_BASE_URL: http://provider-simulator:3415
      META_GRAPH_API_VERSION: v25.0
      META_WHATSAPP_APP_SECRET: ${META_WHATSAPP_APP_SECRET:-mb15a-simulator-secret}
      META_WHATSAPP_VERIFY_TOKEN: ${META_WHATSAPP_VERIFY_TOKEN:-mb15a-verify-token}
      META_WHATSAPP_ACCESS_TOKEN: ${META_WHATSAPP_ACCESS_TOKEN:-mb15a-simulator-access-token}
      PROVIDER_ACCEPTANCE_MODE: "false"
      PROVIDER_ACCEPTANCE_ALLOWED_RECIPIENTS: "+15555550001,+15555550002,+15555550003,+15555550004,+15555550005,+15555550006,+15555550007,+15555550008,+15555550009,+15555550010,+15555550011,+15555550012,+15555550013,+15555550014,+15555550015,+15555550016,+15555550017,+15555550018,+15555550019,+15555550020"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - demo

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: ai-sales-demo-worker
    environment:
      NODE_ENV: development
      DEMO_DB_TARGET: LOCAL
      DEMO_FORCE_LOCAL_DB: "1"
      AI_PROVIDER: ${AI_PROVIDER}
      AI_MODEL_BASE_URL: http://ollama:11434/v1
      AI_MODEL_API_KEY: local
      AI_MODEL_NAME: ${AI_MODEL_NAME:-qwen2.5:1.5b}
      AI_MODEL_LOCAL_TIMEOUTS: "1"
      AI_MODEL_TIMEOUT_MS: ${AI_MODEL_TIMEOUT_MS:-360000}
      AI_RUN_DEADLINE_MS: ${AI_RUN_DEADLINE_MS:-900000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL}
      DEEPSEEK_TIMEOUT_MS: ${DEEPSEEK_TIMEOUT_MS}
      DEEPSEEK_RUN_DEADLINE_MS: ${DEEPSEEK_RUN_DEADLINE_MS:-300000}
      WORKER_LEASE_TTL_SECONDS: ${WORKER_LEASE_TTL_SECONDS:-300}
      DEMO_DOCKER_LOCAL_LLM: "1"
      APP_URL: http://localhost:3000
      API_URL: http://localhost:3001
      DATABASE_URL: postgresql://app_runtime:${APP_RUNTIME_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_sales_agent}
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_sales_agent}
      REDIS_URL: redis://redis:6379
      EMBEDDING_LOCAL_BASE_URL: http://tei:80
      BOOKING_SLOT_TOKEN_SECRET: ${BOOKING_SLOT_TOKEN_SECRET:?set BOOKING_SLOT_TOKEN_SECRET in .env.demo.local}
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env.demo.local}
      PROVIDER_MODE: meta-simulator
      META_GRAPH_BASE_URL: http://provider-simulator:3415
      META_GRAPH_API_VERSION: v25.0
      META_WHATSAPP_APP_SECRET: ${META_WHATSAPP_APP_SECRET:-mb15a-simulator-secret}
      META_WHATSAPP_VERIFY_TOKEN: ${META_WHATSAPP_VERIFY_TOKEN:-mb15a-verify-token}
      META_WHATSAPP_ACCESS_TOKEN: ${META_WHATSAPP_ACCESS_TOKEN:-mb15a-simulator-access-token}
      PROVIDER_ACCEPTANCE_MODE: "false"
      PROVIDER_ACCEPTANCE_ALLOWED_RECIPIENTS: "+15555550001,+15555550002,+15555550003,+15555550004,+15555550005,+15555550006,+15555550007,+15555550008,+15555550009,+15555550010,+15555550011,+15555550012,+15555550013,+15555550014,+15555550015,+15555550016,+15555550017,+15555550018,+15555550019,+15555550020"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - demo
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL in .env.demo.local}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY in .env.demo.local}
    container_name: ai-sales-demo-web
    environment:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      # Server-side BFF → Docker DNS (browser never sees this)
      API_URL: http://api:3001
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - demo

volumes:
  ai_sales_demo_postgres:
  ai_sales_demo_hf_cache:
  ollama_models:

networks:
  demo:
    name: ai-sales-demo-net
