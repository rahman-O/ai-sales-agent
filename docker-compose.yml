services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-sales-agent-postgres
    environment:
      POSTGRES_DB: ai_sales_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: p01_migrate_only
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_sales_agent"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - p01_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: ai-sales-agent-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  p01_pg_data:
